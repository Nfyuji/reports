<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة النظام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body class="auth-body">
  <div class="ambient" aria-hidden="true"></div>
  <main class="auth-card">
    <div class="brand brand-center">
      <span class="brand-mark"></span>
      <div>
        <h1>لوحة الإدارة</h1>
        <p class="brand-sub">إدارة الاشتراكات وأرقام الدخول</p>
      </div>
    </div>
    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}
    <form method="post" class="auth-form">
      <label class="field">
        <span>كلمة مرور الإدارة</span>
        <input name="password" type="password" required autofocus />
      </label>
      <button type="submit" class="btn primary full">دخول</button>
    </form>
    <p class="auth-note muted"><a href="/login">رجوع لدخول المستخدمين</a></p>
  </main>
</body>
</html>
